[project]
name = "hawi"
version = "0.1.0"
description = "AI Agent framework with model compatibility layers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10",
    "anthropic>=0.77.0",
    "httpx[socks]>=0.28.1",
    "linkify-it-py>=2.0.3",
    "markdown-it-py>=3.0.0",
    "markdownify>=1.2.2",
    "mdit-py-plugins>=0.5.0",
    "openai>=2.16.0",
    "prompt-toolkit>=3.0.52",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "rich>=14.3.1",
    "strands-agents>=1.24.0",
    # "strands-agents-tools>=0.2.19",
    "textual>=8.1.1",
    "websockets>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
]
gui = [
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hawi*"]

[tool.setuptools.package-data]
hawi_engine = [
    "templates/hawi_template/.hawi/*",
    "templates/hawi_template/.hawi/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Ignore OpenAI/httpx async stream cleanup warnings (known issue)
    "ignore::RuntimeWarning:asyncio.base_events",
]

[project.scripts]
hawi-engine = "hawi_engine.__main__:main"

[project.entry-points."hawi_engine.gateways"]
stdio = "hawi_engine.builtin_gateways:StdioGateway"
tcp = "hawi_engine.builtin_gateways:TcpGateway"
http = "hawi_engine.http_gateway:HttpGateway"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.uv.workspace]
members = [
]

[dependency-groups]
dev = [
    "hypothesis>=6.151.10",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
]
