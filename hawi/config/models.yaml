# Hawi 内置模型模板配置
# 用户可通过项目根目录的 models.yaml 覆盖或删除这些配置

templates:
  # ==================== DeepSeek ====================
  deepseek-openai:
    class: DeepSeekOpenAIModel
    base_url: https://api.deepseek.com
    model_ids:
      - deepseek-chat
      - deepseek-reasoner

  deepseek-anthropic:
    class: DeepSeekAnthropicModel
    base_url: https://api.deepseek.com/anthropic
    model_ids:
      - deepseek-chat
      - deepseek-reasoner

  # ==================== Kimi / Moonshot ====================
  kimi-openai:
    class: KimiOpenAIModel
    base_url: https://api.moonshot.cn/v1
    model_ids:
      - kimi-k2.5

  kimi-anthropic:
    class: KimiAnthropicModel
    base_url: https://api.kimi.com/coding
    model_ids:
      - kimi-for-coding

  # ==================== MiniMax ====================
  minimax-openai:
    class: MiniMaxOpenAIModel
    base_url: https://api.minimax.io/v1
    model_ids:
      - MiniMax-M2.5
      - MiniMax-M2.5-highspeed
      - MiniMax-M2.1
      - MiniMax-M2.1-highspeed
      - MiniMax-M2

  minimax-anthropic:
    class: MiniMaxAnthropicModel
    base_url: https://api.minimaxi.com/anthropic
    model_ids:
      - MiniMax-M2.5
      - MiniMax-M2.5-highspeed
      - MiniMax-M2.1
      - MiniMax-M2.1-highspeed
      - MiniMax-M2

  # ==================== GLM (Zhipu) ====================
  glm-openai:
    class: OpenAIModel
    base_url: https://open.bigmodel.cn/api/paas/v4
    model_ids:
      - GLM-4.7-Flash
      - GLM-5
      - GLM-4.7
      - GLM-4.7-FlashX

  glm-anthropic:
    class: AnthropicModel
    base_url: https://open.bigmodel.cn/api/anthropic
    model_ids:
      - GLM-4.7-Flash
      - GLM-5
      - GLM-4.7
      - GLM-4.7-FlashX

  # ==================== StepFun ====================
  stepfun-openai:
    class: OpenAIModel
    base_url: https://api.stepfun.com/v1
    model_ids:
      - step-3.5-flash
      - step-r1-v-mini

  # ==================== SiliconFlow ====================
  siliconflow-deepseek:
    class: DeepSeekOpenAIModel
    base_url: https://api.siliconflow.cn/v1
    model_ids:
      - Pro/deepseek-ai/DeepSeek-V3.2
      - deepseek-ai/DeepSeek-V3.2

  siliconflow-kimi:
    class: KimiOpenAIModel
    base_url: https://api.siliconflow.cn/v1
    model_ids:
      - Pro/moonshotai/Kimi-K2.5

  siliconflow-openai:
    class: OpenAIModel
    base_url: https://api.siliconflow.cn/v1
    model_ids:
      - Qwen/Qwen3-235B-A22B

  # ==================== Alibaba (DashScope) ====================
  ali-beijing-openai:
    class: OpenAIModel
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_ids:
      - qwen3.5-plus
      - qwen3-coder-plus
      - qwen3-coder-next
      - qwen3-coder-flash
      - kimi-k2.5
      - glm-5
      - MiniMax-M2.5
      - deepseek-v3.2

  # ==================== OpenAI Official ====================
  openai-official:
    class: OpenAIModel
    model_ids:
      - gpt-5.3

  # ==================== Anthropic Official ====================
  anthropic-official:
    class: AnthropicModel
    model_ids:
      - claude-4-6-opus
